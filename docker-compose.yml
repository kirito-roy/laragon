  #   volumes:
  #     - mongo_data:/data/db
  #   networks:
  #     - laravel_network
  #   ports:
  #     - "27017:27017"

  # The Redis service for caching and queues.
  redis:
    image: redis:alpine
    container_name: laragon-redis
    networks:
      - laravel_network
    ports:
      - "6379:6379"

  # The RabbitMQ service for message queueing.
  rabbitmq:
    image: rabbitmq:3-management
    container_name: laragon-rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - laravel_network
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
  # The Node.js service for asset compilation.
  # node:
  #   image: node:24
